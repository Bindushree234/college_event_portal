<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - College Event Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-blue-600">🎓 College Event Portal</span>
                </div>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Dashboard</a>
                    <a href="/events" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Events</a>
                    <a href="/register" class="text-blue-600 bg-blue-50 px-3 py-2 rounded-md">Register</a>
                    <a href="/analytics" class="text-gray-700 hover:text-blue-600 px-3 py-2 rounded-md">Analytics</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow p-8">
            <h1 class="text-3xl font-bold mb-6">📝 Participant Registration</h1>
            
            <form id="registerForm">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Select Event</label>
                    <select id="eventId" required class="w-full border rounded-lg p-2">
                        <option value="">-- Select Event --</option>
                    </select>
                </div>
                
                <div class="border-t pt-4 mt-4">
                    <h2 class="text-xl font-bold mb-4">Participant Details</h2>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 mb-1">Full Name *</label>
                        <input type="text" id="name" required class="w-full border rounded-lg p-2">
                    </div>
                    
                    <div class="mb-3">
                        <label class="block text-gray-700 mb-1">Type *</label>
                        <select id="type" required class="w-full border rounded-lg p-2">
                            <option value="Internal">Internal Student</option>
                            <option value="External">External Student</option>
                        </select>
                    </div>
                    
                    <div id="internalFields">
                        <div class="mb-3">
                            <label class="block text-gray-700 mb-1">Department</label>
                            <select id="department" class="w-full border rounded-lg p-2">
                                <option value="CSE">CSE</option>
                                <option value="ISE">ISE</option>
                                <option value="ECE">ECE</option>
                                <option value="ME">ME</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="block text-gray-700 mb-1">Year</label>
                            <select id="year" class="w-full border rounded-lg p-2">
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                                <option value="3">3rd Year</option>
                                <option value="4">4th Year</option>
                            </select>
                        </div>
                    </div>
                    
                    <div id="externalFields" class="hidden">
                        <div class="mb-3">
                            <label class="block text-gray-700 mb-1">College Name</label>
                            <input type="text" id="collegeName" class="w-full border rounded-lg p-2">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-semibold mt-4">Register for Event</button>
            </form>
        </div>
    </main>

    <script>
        async function loadEvents() {
            const response = await fetch('/api/events');
            const events = await response.json();
            const options = events.map(e => `<option value="${e.Event_ID || e.event_id}">${e.Event_Name || e.event_name} (${e.Event_Date || e.event_date})</option>`).join('');
            document.getElementById('eventId').innerHTML = '<option value="">-- Select Event --</option>' + options;
        }
        
        document.getElementById('type').addEventListener('change', function() {
            const internal = document.getElementById('internalFields');
            const external = document.getElementById('externalFields');
            if (this.value === 'Internal') {
                internal.classList.remove('hidden');
                external.classList.add('hidden');
            } else {
                internal.classList.add('hidden');
                external.classList.remove('hidden');
            }
        });
        
        function generateParticipantId() {
            return 'P' + Date.now().toString().slice(-6);
        }
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const type = document.getElementById('type').value;
            const registrationData = {
                event_id: document.getElementById('eventId').value,
                participant_id: generateParticipantId(),
                name: document.getElementById('name').value,
                type: type,
                department: type === 'Internal' ? document.getElementById('department').value : null,
                year: type === 'Internal' ? document.getElementById('year').value : null,
                college_name: type === 'External' ? document.getElementById('collegeName').value : null
            };
            
            const response = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(registrationData)
            });
            
            const result = await response.json();
            if (response.ok) {
                alert(`Registration successful!\nParticipant ID: ${registrationData.participant_id}`);
                document.getElementById('registerForm').reset();
                loadEvents();
            } else {
                alert('Error: ' + result.error);
            }
        });
        
        loadEvents();
    </script>
</body>
</html>
